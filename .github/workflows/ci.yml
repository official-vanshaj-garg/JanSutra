name: JanSutra CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install All Dependencies
      run: npm run install:all

    - name: Lint Client
      working-directory: ./client
      run: npm run lint

    - name: Install Server ESLint Dependencies
      working-directory: ./server
      run: npm install

    - name: Lint Server
      working-directory: ./server
      run: npm run lint

    - name: Run Server Tests
      working-directory: ./server
      run: npm test

    - name: Production Build
      run: npm run build
